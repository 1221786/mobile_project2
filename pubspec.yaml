publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # Network & Storage
  http: ^1.2.2
  shared_preferences: ^2.2.3

  # Notifications (Local)
  flutter_local_notifications: ^17.2.2
